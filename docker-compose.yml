# =====================================================================
# Chatbot académico UNAB - servicios en Docker
# Uso local:  docker compose up -d
# Las variables se leen del archivo .env (ver .env.example)
# =====================================================================
name: chatbot

services:
  n8n:
    image: n8nio/n8n:2.46.7
    container_name: chatbot-n8n
    restart: unless-stopped
    ports:
      # Solo accesible desde este equipo; en EC2 se entra por túnel SSH
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${TZ}
      - TZ=${TZ}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # El nodo de archivos solo puede leer la carpeta de documentos del RAG
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/corpus
    volumes:
      - n8n_data:/home/node/.n8n
      - ./rag/corpus:/data/corpus:ro
      # Workflows exportados, para importarlos con n8n import:workflow
      - ./n8n/workflows:/data/workflows:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chatbot-net

  mcp-server:
    build: ./mcp-server
    image: chatbot-mcp-server:1.0
    container_name: chatbot-mcp
    restart: unless-stopped
    ports:
      # Local: para el MCP Inspector. En EC2 lo publica Caddy con HTTPS.
      - "127.0.0.1:9000:9000"
    environment:
      # Solo las variables que necesita este servicio
      - SUPABASE_DB_HOST=${SUPABASE_DB_HOST}
      - SUPABASE_DB_PORT=${SUPABASE_DB_PORT}
      - SUPABASE_DB_NAME=${SUPABASE_DB_NAME}
      - SUPABASE_DB_SSLMODE=${SUPABASE_DB_SSLMODE}
      - DB_MCP_USER=${DB_MCP_USER}
      - DB_MCP_PASSWORD=${DB_MCP_PASSWORD}
      - MCP_PORT=9000
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - TZ=${TZ}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chatbot-net

  api:
    build: ./backend
    image: chatbot-api:1.0
    container_name: chatbot-api
    restart: unless-stopped
    ports:
      # Local: el emulador de Android entra por http://10.0.2.2:8080. En EC2 la publica Caddy con HTTPS.
      - "127.0.0.1:8080:8080"
    environment:
      # Solo las variables que necesita este servicio
      - SUPABASE_DB_HOST=${SUPABASE_DB_HOST}
      - SUPABASE_DB_PORT=${SUPABASE_DB_PORT}
      - SUPABASE_DB_NAME=${SUPABASE_DB_NAME}
      - SUPABASE_DB_SSLMODE=${SUPABASE_DB_SSLMODE}
      - DB_API_USER=${DB_API_USER}
      - DB_API_PASSWORD=${DB_API_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_EXPIRES_MINUTES=${JWT_EXPIRES_MINUTES}
      - N8N_INTERNAL_URL=http://n8n:5678/webhook/
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      # La API no se publica directamente: solo confía en la IP que reenvía Caddy o el host
      - FORWARDED_ALLOW_IPS=*
      - TZ=${TZ}
    depends_on:
      - n8n
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chatbot-net

  scraper:
    build: ./scraper
    image: chatbot-scraper:1.0
    container_name: chatbot-scraper
    restart: unless-stopped
    # Sin puertos publicados: solo n8n lo llama por la red interna (http://scraper:8000)
    environment:
      - SCRAPER_TOKEN=${SCRAPER_TOKEN}
      - SCRAPER_DOMINIOS_PERMITIDOS=unab.edu.co,scraper
      - TZ=${TZ}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chatbot-net

volumes:
  n8n_data:
    name: chatbot_n8n_data

networks:
  chatbot-net:
    name: chatbot-net
